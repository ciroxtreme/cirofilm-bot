name: Test Cloudflare WARP + cfsolve

on:
  workflow_dispatch:

jobs:
  warp-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Setup Cloudflare WARP SOCKS5 Proxy
        run: |
          echo "📥 Menambahkan repository resmi Cloudflare..."
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y
          sudo apt-get install -y cloudflare-warp

          echo "🚀 Menyalakan service WARP & Registrasi Anonim..."
          sudo systemctl start warp-svc
          sleep 2

          # Register perangkat gratis tanpa akun
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect

          # Tunggu koneksi stabil
          sleep 4
          warp-cli --accept-tos status

          echo "🔍 Cek IP keluar via WARP SOCKS5 Proxy..."
          curl -x socks5://127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace

      - name: Duet cfsolve + WARP SOCKS5 Tunnel
        run: |
          chmod +x ./bin/challenge
          mkdir -p /tmp/warp_out

          echo "⚡ Menguji cfsolve melewati terowongan Cloudflare WARP TLS..."
          ./bin/challenge --page "https://gudangvape.com/search.php?s=Lets%20fight%20ghost&page=1" /tmp/warp_out --solve --fingerprint ./profiles/safari-26-ios.json --proxy socks5://127.0.0.1:40000 || true

          ls -la /tmp/warp_out
          if [ -f /tmp/warp_out/cleared.html ]; then
            echo "🎉 [BERHASIL TEMBUS] Hasil Cleared HTML:"
            cat /tmp/warp_out/cleared.html | head -c 300
          else
            echo "⚠️ Belum tembus, cek log di atas."
          fi
